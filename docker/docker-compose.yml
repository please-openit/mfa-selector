name: mfa-selector

services:
  # Stands in for the customer's Active Directory: it holds passwords and nothing else.
  ldap:
    image: osixia/openldap:1.5.0
    container_name: mfa-selector-ldap
    command: ["--copy-service", "--loglevel", "warning"]
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    volumes:
      - ./ldap/users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "ldapsearch -x -H ldap://127.0.0.1 -b uid=grace,ou=users,dc=example,dc=org -D cn=admin,dc=example,dc=org -w admin > /dev/null"
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mfa-selector-keycloak
    depends_on:
      ldap:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
      - --log-level=INFO,it.pleaseopen.keycloak.mfaselector:DEBUG
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./realm-mfa-demo.json:/opt/keycloak/data/import/realm-mfa-demo.json:ro
      - ./realm-mfa-flow-demo.json:/opt/keycloak/data/import/realm-mfa-flow-demo.json:ro
    ports:
      - "8080:8080"
      - "9000:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
