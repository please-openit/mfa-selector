selectSecondFactorTitle=Secure your account
selectSecondFactorInstruction=Add a second factor to your account to keep it protected.
selectSecondFactorSkip=Not now
selectSecondFactorInvalidSelection=Choose one of the methods below.
selectSecondFactorDeadline=Set one up before {0}.
selectSecondFactorOverdue=The deadline of {0} has passed. Set up a second factor now.

# Enrolment wording for the factors Keycloak ships. Any credential type without an entry here falls
# back to the display name and help text its credential provider publishes.
selectSecondFactorName-otp=Authenticator application
selectSecondFactorHelp-otp=Use a code generated by an authenticator app on your phone.
selectSecondFactorName-webauthn=Security key
selectSecondFactorHelp-webauthn=Use a security key or your device''s screen lock as a second step.
selectSecondFactorName-webauthn-passwordless=Passkey
selectSecondFactorHelp-webauthn-passwordless=Register a passkey to sign in without a password.
selectSecondFactorName-recovery-authn-codes=Recovery codes
selectSecondFactorHelp-recovery-authn-codes=Keep a list of single-use codes for when nothing else is available.

# Admin console. Keycloak serves the login and the admin console from the same bundle name, so both
# live here; only the keys below are read by the admin console, which resolves them with i18next.
# Unlike the login keys above, these must NOT double their apostrophes: i18next has no MessageFormat
# behind it, so a doubled quote is shown as written.
secondFactorSelector.offeredActions.label=Offered second factors
secondFactorSelector.offeredActions.help=Aliases of the required actions offered on the selection screen, for instance CONFIGURE_TOTP, webauthn-register, webauthn-register-passwordless or CONFIGURE_RECOVERY_AUTHN_CODES. Leave empty to offer every enabled required action of the realm able to register a second factor, including those from third-party providers. A required action that is disabled is never offered.
secondFactorSelector.allowSkip.label=Allow skipping
secondFactorSelector.allowSkip.help=Show a button letting the user finish logging in without enrolling a second factor. The screen is shown again on the next login.
secondFactorSelector.announcedDeadline.label=Announced deadline
secondFactorSelector.announcedDeadline.help=Date and time shown to the user as the deadline for enrolling, in ISO 8601 with an offset, for instance 2026-10-15T18:00:00+02:00. It is announced only: enrolment is forced at the end of the grace period below. When that end comes first, it is the one announced, so the screen never promises more time than there is. Leave empty to announce nothing.
secondFactorSelector.gracePeriodEnd.label=End of grace period
secondFactorSelector.gracePeriodEnd.help=Date and time past which postponing is no longer offered, same format. Leave empty for "Allow skipping" to apply without a time limit. A value that cannot be read is treated as a grace period already over, so that a typo never opens the door.
