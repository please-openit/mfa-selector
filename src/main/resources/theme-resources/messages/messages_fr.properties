selectSecondFactorTitle=Sécurisez votre compte
selectSecondFactorInstruction=Ajoutez un second facteur à votre compte pour mieux le protéger.
selectSecondFactorSkip=Plus tard
selectSecondFactorInvalidSelection=Choisissez l''une des méthodes proposées.
selectSecondFactorDeadline=À configurer avant le {0}.
selectSecondFactorOverdue=Le délai du {0} est dépassé. Configurez un second facteur sans plus attendre.

# Formulations d''enrôlement pour les facteurs livrés par Keycloak. Un type de credential absent ici
# retombe sur le nom et le texte d''aide publiés par son credential provider.
selectSecondFactorName-otp=Application d''authentification
selectSecondFactorHelp-otp=Utilisez un code généré par une application d''authentification sur votre téléphone.
selectSecondFactorName-webauthn=Clé de sécurité
selectSecondFactorHelp-webauthn=Utilisez une clé de sécurité ou le verrouillage de votre appareil comme seconde étape.
selectSecondFactorName-webauthn-passwordless=Passkey
selectSecondFactorHelp-webauthn-passwordless=Enregistrez une passkey pour vous connecter sans mot de passe.
selectSecondFactorName-recovery-authn-codes=Codes de récupération
selectSecondFactorHelp-recovery-authn-codes=Conservez une liste de codes à usage unique en cas de besoin.

# Console d'administration. Keycloak sert la connexion et la console d'administration depuis le même
# nom de bundle, les deux cohabitent donc ici ; seules les clés ci-dessous sont lues par la console,
# qui les résout avec i18next. Contrairement aux clés de connexion ci-dessus, elles ne doivent PAS
# doubler leurs apostrophes : sans MessageFormat derrière, une apostrophe doublée s'affiche telle
# quelle. C'est d'ailleurs la convention des traductions natives de la console.
secondFactorSelector.offeredActions.label=Seconds facteurs proposés
secondFactorSelector.offeredActions.help=Alias des required actions proposées sur l'écran de choix, par exemple CONFIGURE_TOTP, webauthn-register, webauthn-register-passwordless ou CONFIGURE_RECOVERY_AUTHN_CODES. Laissez vide pour proposer toutes les required actions activées du realm capables d'enregistrer un second facteur, y compris celles fournies par des providers tiers. Une required action désactivée n'est jamais proposée.
secondFactorSelector.allowSkip.label=Autoriser le report
secondFactorSelector.allowSkip.help=Affiche un bouton permettant à l'utilisateur de terminer sa connexion sans enrôler de second facteur. L'écran est présenté à nouveau à la connexion suivante.
secondFactorSelector.announcedDeadline.label=Date butoir annoncée
secondFactorSelector.announcedDeadline.help=Date et heure annoncées à l'utilisateur comme échéance d'enrôlement, au format ISO 8601 avec décalage, par exemple 2026-10-15T18:00:00+02:00. Elle est seulement annoncée : le forçage intervient à la fin de la période de grâce ci-dessous. Si cette fin survient avant, c'est elle qui est annoncée, pour que l'écran ne promette jamais plus de temps qu'il n'en reste. Laissez vide pour n'annoncer aucune échéance.
secondFactorSelector.gracePeriodEnd.label=Fin de la période de grâce
secondFactorSelector.gracePeriodEnd.help=Date et heure au-delà desquelles le report n'est plus proposé, même format. Laissez vide pour que « Autoriser le report » s'applique sans limite de temps. Une valeur illisible est traitée comme une période de grâce déjà terminée, pour qu'une faute de frappe n'ouvre jamais la porte.
